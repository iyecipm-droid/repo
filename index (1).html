<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0d0b0a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="R.E.P.O."><meta name="theme-color" content="#0d0b0a"><title>R.E.P.O. Mobile v8.7</title>
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0d0b0a;--ink:#e8dfcf;--rust:#c2562b;--sick:#d9c24a;--hp:#c93a3a;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b0a}}
:root[data-theme="dark"]{--bg:#0d0b0a}
*{touch-action:none;-webkit-user-select:none;user-select:none;box-sizing:border-box}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px!important}
*{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}body{position:fixed;width:100%}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:700 14px/1.3 "Arial Narrow","Franklin Gothic Medium",Impact,sans-serif}
canvas{position:fixed;top:0;left:0;right:0;bottom:0;inset:0}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;pointer-events:none}
.bar{width:100px;height:8px;background:#2a2522;margin:0 0 5px}.bar i{display:block;height:100%}
#msg{color:var(--sick);text-align:center;flex:1}#tot{text-align:right;font-size:13px}#tot img{height:16px;vertical-align:middle}
#btns{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:grid;grid-template-columns:repeat(3,58px);gap:8px;direction:rtl}
.b{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:rgba(232,223,207,.12);color:var(--ink);font:inherit;font-size:11px;padding:0}
.b.big{border-color:var(--rust)}.b.on{background:var(--rust)}.b.h{display:none}
#slots{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);display:flex;gap:6px}
.sl{width:56px;height:56px;border:2px solid #5a4136;background:rgba(13,11,10,.7);color:var(--ink);font:inherit;font-size:11px;padding:0}.sl.q{border-color:var(--sick)}
#fin{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);display:none}
#ov{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;display:none;background:rgba(13,11,10,.92);overflow:auto}#ov,#ov *{touch-action:pan-y}
.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:20px}
#ov h1{margin:0;font:400 46px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:4px;color:var(--rust)}
#ov p{margin:0;max-width:320px;color:#b9b0a0}
.go{background:var(--rust);color:#fff;border:0;padding:12px 22px;font:inherit;font-size:16px;min-width:240px}
.go.s{background:#2a2522;color:var(--ink);font-size:13px;padding:8px 12px}.go:disabled{opacity:.35}
.b.ic{background-size:cover;background-position:center;border-color:#1a3a0f}.b.ic.on{filter:brightness(1.5)}.grid2{display:grid;grid-template-columns:repeat(3,104px);gap:6px;margin:6px 0}.cd{background:#af8f3a;color:#1a1408;border:0;border-radius:6px;padding:5px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.cd .ci{background:#d9c996;width:100%;height:40px;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:3px}.cd:disabled{opacity:.4}.cd i{font-style:normal;font-weight:400}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:300px}.lg .go{min-width:0;padding:12px 4px}.go.on{outline:2px solid var(--sick);color:var(--sick)}#ov .go{width:100%;max-width:300px;min-width:0}#ov .in{width:100%;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
#mn{pointer-events:auto;margin:0;background:rgba(232,223,207,.12);border:1px solid var(--ink);color:var(--ink);font:inherit;font-size:11px;padding:3px 10px;border-radius:4px}</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><div class="bar"><i id="hp" style="background:var(--hp)"></i></div><div class="bar"><i id="st" style="background:var(--sick)"></i></div><button id="mn" onclick="menu()">Меню</button></div><div id="msg"></div><div id="tot"></div></div>
<div id="btns"><button class="b big" data-k="hand">Рука</button><button class="b" data-k="run">Біг</button><button class="b" data-k="crouch">Присісти</button><button class="b" data-k="light">Ліхтар</button><button class="b" data-k="map">Карта</button><button class="b h" data-k="hide">Сховатись</button><button class="b h" data-k="jump">Стрибок</button><button class="b h big" data-k="fire">Вогонь</button><button class="b h" data-k="out">Виняти</button></div>
<div id="slots"><button class="sl" id="s0"></button><button class="sl" id="s1"></button><button class="sl" id="s2"></button></div>
<button class="go" id="fin" onclick="finish()">Завершити раунд</button>
